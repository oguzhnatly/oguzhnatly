name: Latest writing

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update_readme_with_writing:
    name: List the latest articles from oguzhanatalay.com/writing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Each link carries campaign tags, so Google Analytics shows visits from this profile and which article was opened
      - name: Write the latest articles into the README
        run: |
          python3 << 'SCRIPT'
          import json, re, urllib.request
          from urllib.parse import urlencode

          FEED = 'https://oguzhanatalay.com/writing/feed.json'
          request = urllib.request.Request(FEED, headers={'User-Agent': 'oguzhnatly profile readme'})
          items = json.load(urllib.request.urlopen(request, timeout=30))['items'][:5]

          def tagged(url, content):
              query = urlencode({'utm_source': 'github', 'utm_medium': 'profile_readme', 'utm_campaign': 'writing', 'utm_content': content})
              return f'{url}?{query}'

          lines = []
          for item in items:
              slug = item['url'].rstrip('/').rsplit('/', 1)[1]
              lines.append(f"- [{item['title']}]({tagged(item['url'], slug)})")
          lines.append('')
          lines.append(f"[All writing →]({tagged('https://oguzhanatalay.com/writing/', 'all_writing')})")
          posts = '\n'.join(lines)

          with open('README.md') as f:
              readme = f.read()
          start, end = '<!-- HASHNODE:START -->', '<!-- HASHNODE:END -->'
          if start in readme and end in readme:
              readme = readme[:readme.index(start) + len(start)] + '\n' + posts + '\n' + readme[readme.index(end):]
          with open('README.md', 'w') as f:
              f.write(readme)
          print(posts)
          SCRIPT

      - name: Commit and push
        run: |
          git config --global user.email "oguzhnatly@gmail.com"
          git config --global user.name "Oguzhan Atalay"
          git add README.md
          git diff --cached --quiet || git commit -m "Updated readme with the latest writing"
          git push
